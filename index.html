<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hot-products-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); /* to hơn */
  gap: 20px;
}

.hot-product-card {
  background: #f9f9f9;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
  transition: 0.3s;
  display: flex;
  flex-direction: column;
  gap: 0px;
}

.hot-product-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
}

.hot-product-image {
  position: relative;
  text-align: center;
  background: #fff;
}

.hot-product-image img {
  width: 100%;
  height: auto;
  /* Có thể gây ra đường hở */
  border-bottom: 1px solid #eee;
  display: block; /* Thêm dòng này để tránh khoảng trắng dưới ảnh */
}

.hot-product-icons {
  position: absolute;
  top: 8px;
  right: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px; /* tạo khoảng cách đều nhau giữa các icon */
}

.hot-product-icons .icon-hover-group {
  display: none;
  transition: all 3s ease-in;
  flex-direction: column;
  gap: 8px; /* tạo khoảng cách đều nhau giữa các icon */
}

.hot-product-icons i {
  background: #fff;
  border-radius: 50%;
  padding: 8px;
  font-size: 14px;
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Hover vào icon thì glow + scale lên */
.hot-product-icons i:hover {
  transform: scale(1.3) rotate(5deg);
  box-shadow: 0 0 12px #0c2b63;
  color: #0c2b63;
}
 
.tag-discount,
.tag-new {
  position: absolute;
  top: 10px;
  left: 10px;
  border: solid 1px #ff000f;
  color: #ff000f;
  padding: 3px 6px;
  font-size: 16px;
  border-radius: 4px;
}

.tag-new {
  top: 90%;
  background: red;
  display: flex;
  align-items: center;
  gap: 4px;
  color: #fff;
}

.tag-new img {
  width: 16px;
}

.hot-product-content {
  padding: 10px 15px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  margin: 0;
}

.hot-product-colors {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.color-item {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid #000;
  position: relative;
}

.color-item::after {
  content: attr(data-color);
  position: absolute;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 3px 6px;
  font-size: 10px;
  border-radius: 4px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  white-space: nowrap;
}

.color-item:hover::after {
  opacity: 1;
}

.color-item.blue {
  background: #4994ec;
}
.color-item.green {
  background: #5cc58d;
}
.color-item.pink {
  background: #e89acb;
}

.hot-product-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
  line-height: 1.4;
  color: #0c2b63;
}
.hot-product-title:hover {
  color: #4bd963; /* Hoặc màu bạn muốn */

  transform: scale(1.05); /* Phóng to nhẹ */
}

.hot-product-price {
  font-size: 15px;
  margin-bottom: 10px;
}

.price-old {
  color: #999;
  margin-right: 6px;
  font-size: 13px;
}

.price-new {
  color: #000;
  font-weight: bold;
  font-size: 15px;
}

.hot-product-progress {
  margin-bottom: 10px;
}

.progress-bar {
    border: solid 1px #0c2b63;
  border-radius: 8px;
  overflow: hidden;
  height: 16px;
  position: relative;
}

.progress-fill {
  /* background: linear-gradient(90deg, #fa6262, #ff9c9c); */
 color: #0c2b63;
  height: 100%;
  border-radius: 8px 0 0 8px;
  display: flex;
  align-items: center;
  justify-content: flex-start; /* Thêm dòng này để căn trái */
  padding-left: 8px;

  font-size: 10px;
  font-weight: bold;
}

.sold-info {
  font-size: 10px;
  text-align: left;
  /* Xóa `left: 10px;` nếu không dùng position */
}

.hot-product-rating {
  color: gold;
  font-size: 14px;
}
    </style>
</head>
<body>
    <div class="session_category">
      <section class="category_list">
      <div class="title_category">
        <div class="title_category_left">
        | Hàng Order
        </div>
          <div class="title_category_right">
         <a href="">Xem tất cả >> </a>
        </div>
      </div>
       <div class="main_category">
        <div class="images_category_left">
         <img src="/public/images/category/bongro.webp" alt="">
        </div>
        <div class="slider_category_right">
            <div class="slider_category_products">
               <div className="hot-products-list">
            <div className="hot-product-card">
              <div className="hot-product-image">
                <img
                  src="/public/images/products/chaybo/ConverseRunStarMotion.webp"
                  alt=""
                />
                <div className="hot-product-icons">
                  <i className="fa-solid fa-heart icon-favorite"></i>
                  <div className="icon-hover-group">
                    <i className="fa-solid fa-eye"></i>
                    <i className="fa-solid fa-list"></i>
                    <i className="fa fa-exchange"></i>
                  </div>
                </div>
                <span className="tag-discount">-20%</span>
                <span className="tag-new">
                  <img src="/images/logo/title_image_1_tag.webp" alt="" />
                  Mới
                </span>
              </div>
              <div className="hot-product-content">
                <div className="hot-product-colors">
                  <span
                    className="color-item blue"
                    data-color="Xanh dương"
                  ></span>
                  <span
                    className="color-item green"
                    data-color="Xanh lá"
                  ></span>
                  <span className="color-item pink" data-color="Hồng"></span>
                </div>
                <h4 className="hot-product-title">
                  Giày Converse Run Star Motion
                </h4>
                <div className="hot-product-price">
                  <span className="price-old">
                    <del>1.500.000đ</del>
                  </span>
                  <span className="price-new">1.200.000đ</span>
                </div>
                <div className="hot-product-progress">
                  <div className="progress-bar">
                    <div className="progress-fill" >
                      <span className="sold-info">Đã bán 87 sản phẩm</span>
                    </div>
                  </div>
                </div>
                <div className="hot-product-rating">
                  <i className="fa-solid fa-star"></i>
                  <i className="fa-solid fa-star"></i>
                  <i className="fa-solid fa-star"></i>
                  <i className="fa-solid fa-star"></i>
                  <i className="fa-regular fa-star"></i>
                </div>
              </div>
            </div>
           
          </div>
            </div>
        </div>
       </div>
      </section>
    </div>
</body>
</html>
